name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JolamanStudyWarrior-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"            PROJECT_DIR="."
          else
            PROJECT_DIR="JolamanAPKNoStudio"
          fi

          cd "$PROJECT_DIR"
          ../gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug || \
          ./gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            mkdir -p out
            cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          else
            mkdir -p out
            cp JolamanAPKNoStudio/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JolamanStudyWarrior-debug-apk
          path: out/app-debug.apk
